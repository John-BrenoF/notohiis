[package]
name = "tool-nth"
version = "0.1.0"
edition = "2021"
license = "LUMEJ-1.0"
description = "Depurador de código Python do Notohiis"

[lib]
name = "tool_nth"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
test-python = ["pyo3/auto-initialize"]

[dependencies]
pyo3 = { version = "0.26", features = ["abi3-py39", "py-clone"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
lto = "thin"
